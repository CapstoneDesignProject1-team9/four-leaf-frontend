# =============================================================
# [four-laef-frontend] CI Pipeline
# 경로: .github/workflows/ci.yml
#
# 트리거: PR 생성/업데이트, main 브랜치 push
# 단계:
#   1. Node.js 의존성 설치
#   2. Lint (oxlint)
#   3. TypeScript 타입 체크 (tsc --noEmit)
#   4. 빌드 검증
# =============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Frontend CI (Node.js Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package-lock.json이 있을 때만 캐시 활성화
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_AI_BASE_URL: /ai

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
