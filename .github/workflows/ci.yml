# =============================================================
# [four-laef-frontend] CI Pipeline
# 경로: .github/workflows/ci.yml
#
# 트리거: PR 생성/업데이트, main 브랜치 push
# 단계:
#   1. Node.js 의존성 설치
#   2. 타입 체크 (TypeScript 프로젝트인 경우)
#   3. Lint (ESLint)
#   4. 빌드 검증
# =============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Frontend CI (Node.js Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: false

      - name: Type check
        run: npm run type-check --if-present
        continue-on-error: true   # TypeScript 미사용 프로젝트 대비

      - name: Build
        run: npm run build
        env:
          # Vite 빌드 시 필요한 최소 환경변수 (실제 값 불필요, 빌드 검증용)
          VITE_API_BASE_URL: /api
          VITE_AI_BASE_URL: /ai

      - name: Upload build artifact (선택)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
